services:
  db:
    image: postgres:17
    container_name: fastapi-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kakeibo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fastapi-api
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/kakeibo
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      - db

volumes:
  postgres_data: